spring.application.name=pet-service
server.port=8081

# Temporary in-memory database (we switch to PostgreSQL in Phase 3)
spring.datasource.url=jdbc:h2:mem:petdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Let Hibernate create tables automatically from our entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Show error messages in responses (helpful for testing)
server.error.include-message=always


# API key security
# Reads the PET_API_KEY environment variable; falls back to the default for local testing
app.security.api-key=${PET_API_KEY:pet-service-key-2026}