spring.application.name=pet-service
server.port=8081

# PostgreSQL connection (environment variables override these defaults, used later in Docker)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/petdb}
spring.datasource.username=${DB_USERNAME:petcare}
spring.datasource.password=${DB_PASSWORD:petcare123}

# Let Hibernate create/update tables from our entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Show error messages in responses (helpful for testing)
server.error.include-message=always

# API key security
app.security.api-key=${PET_API_KEY:pet-service-key-2026}