services:
  postgres:
    image: postgres:16
    container_name: pet-postgres
    environment:
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: