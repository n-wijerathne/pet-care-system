services:
  postgres:
    image: postgres:16
    container_name: pet-postgres
    environment:
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: pet-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/petcare-realm.json:/opt/keycloak/data/import/petcare-realm.json

volumes:
  pgdata: