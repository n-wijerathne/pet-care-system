spring.application.name=appointment-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appointmentdb}
spring.datasource.username=${DB_USERNAME:petcare}
spring.datasource.password=${DB_PASSWORD:petcare123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always

# This service's own API key (what callers must send to us)
app.security.api-key=${APPOINTMENT_API_KEY:appointment-service-key-2026}

# Other services we call (URL + the key THEY expect from us)
app.pet-service.url=${PET_SERVICE_URL:http://localhost:8081}
app.pet-service.api-key=${PET_API_KEY:pet-service-key-2026}

app.catalog-service.url=${CATALOG_SERVICE_URL:http://localhost:8083}
app.catalog-service.api-key=${CATALOG_API_KEY:catalog-service-key-2026}