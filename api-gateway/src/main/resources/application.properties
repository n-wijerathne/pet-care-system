spring.application.name=api-gateway
server.port=8080

# Where each service lives, and the secret key each one expects from the gateway
app.pet-service.url=${PET_SERVICE_URL:http://localhost:8081}
app.pet-service.api-key=${PET_API_KEY:pet-service-key-2026}

app.catalog-service.url=${CATALOG_SERVICE_URL:http://localhost:8083}
app.catalog-service.api-key=${CATALOG_API_KEY:catalog-service-key-2026}

app.appointment-service.url=${APPOINTMENT_SERVICE_URL:http://localhost:8082}
app.appointment-service.api-key=${APPOINTMENT_API_KEY:appointment-service-key-2026}


# OAuth 2.0: where to download Keycloak's public keys to verify token signatures
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8180/realms/petcare/protocol/openid-connect/certs}


# CORS: browser origins allowed to call the gateway (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Rate limiting per client IP: tokens refilled per second, and max burst size
app.rate-limit.replenish-rate=${RATE_LIMIT_REPLENISH:5}
app.rate-limit.burst-capacity=${RATE_LIMIT_BURST:10}

# Redis (stores the rate-limit counters)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}