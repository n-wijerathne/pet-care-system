spring.application.name=api-gateway
server.port=8080

# Where each service lives, and the secret key each one expects from the gateway
app.pet-service.url=${PET_SERVICE_URL:http://localhost:8081}
app.pet-service.api-key=${PET_API_KEY:pet-service-key-2026}

app.catalog-service.url=${CATALOG_SERVICE_URL:http://localhost:8083}
app.catalog-service.api-key=${CATALOG_API_KEY:catalog-service-key-2026}

app.appointment-service.url=${APPOINTMENT_SERVICE_URL:http://localhost:8082}
app.appointment-service.api-key=${APPOINTMENT_API_KEY:appointment-service-key-2026}